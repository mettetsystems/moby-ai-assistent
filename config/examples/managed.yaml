# Managed-process example. Device indices are configuration, not code constants.
# Operator walkthrough: docs/setup.md
# First-run wizard (writes launch argv): ./scripts/setup.sh --mode managed
#
# MobyAI spawns isolated llama.cpp servers from each role's `launch` list and sets
# CUDA_VISIBLE_DEVICES from hardware.<role>.device. Planner and Worker that share
# a device are swapped; they are not loaded at the same time.
# Use config/default.yaml instead if you already run the HTTP servers yourself.

project:
  workspace_root: ~/MobyAI/projects

runtime:
  max_task_attempts: 2
  command_timeout_seconds: 600
  checkpointing: true
  max_output_bytes: 1048576
  max_log_bytes: 52428800
  max_schema_repair_attempts: 2
  inference_timeout_seconds: 600
  max_worker_turns: 8
  max_planner_inspect_turns: 3

context:
  worker_token_budget: 48000
  log_tail_lines: 150
  prefer_import_contracts: true

persistence:
  database_path: ~/MobyAI/mobyai.db

huggingface:
  token_file: ~/MobyAI/secrets/hf_token

services:
  mode: managed
  health_timeout_seconds: 600
  health_poll_interval_seconds: 0.5
  stop_timeout_seconds: 15
  swap_shared_device: true

hardware:
  planner:
    device: 0
  orchestrator:
    device: 1
  worker:
    device: 0

models:
  planner:
    provider: openai_compatible
    engine: llama.cpp
    model: "Qwen/Qwen3-32B-GGUF:Q4_K_M"
    gpu: 0
    endpoint: http://127.0.0.1:9802
    quantization: q4
    inference:
      max_model_len: 32768
    launch:
      - llama
      - serve
      - -hf
      - "{model}"
      - --host
      - 127.0.0.1
      - --port
      - "{port}"
      - --ctx-size
      - "{ctx}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --parallel
      - "1"
      - -ngl
      - "99"
      - --jinja
  orchestrator:
    provider: openai_compatible
    engine: llama.cpp
    model: "Qwen/Qwen2.5-7B-Instruct-GGUF:Q5_K_M"
    gpu: 1
    endpoint: http://127.0.0.1:9801
    quantization: q5
    inference:
      max_model_len: 16384
    launch:
      - llama
      - serve
      - -hf
      - "{model}"
      - --host
      - 127.0.0.1
      - --port
      - "{port}"
      - --ctx-size
      - "{ctx}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --parallel
      - "1"
      - -ngl
      - "99"
      - --jinja
  worker:
    provider: openai_compatible
    engine: llama.cpp
    model: "unsloth/Qwen3.5-35B-A3B-GGUF:Q4_K_M"
    gpu: 0
    endpoint: http://127.0.0.1:9800
    quantization: q4
    inference:
      max_model_len: 65536
    launch:
      - llama
      - serve
      - -hf
      - "{model}"
      - --host
      - 127.0.0.1
      - --port
      - "{port}"
      - --ctx-size
      - "{ctx}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --parallel
      - "1"
      - -ngl
      - "99"
      - --jinja
