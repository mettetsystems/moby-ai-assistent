# Reference configuration for external inference servers.
# Field-by-field operator guide: docs/setup.md
# First-run wizard: ./scripts/setup.sh   or   python -m mobyai setup
#
# Copy this file, or run ./scripts/setup.sh and press Enter to keep the
# reference Hugging Face models. Override any field; ids must match GET /v1/models.
#
# services.mode: external means you start the three HTTP servers. MobyAI only
# healthchecks them. Use config/examples/managed.yaml to spawn processes instead.

project:
  # Per-project workspaces are created under this root unless init --workspace is set.
  workspace_root: ~/MobyAI/projects

runtime:
  # First failure retries; second failure escalates to a DAG branch patch.
  max_task_attempts: 2
  command_timeout_seconds: 600
  checkpointing: true
  max_output_bytes: 1048576
  max_log_bytes: 52428800
  max_schema_repair_attempts: 2
  inference_timeout_seconds: 600
  max_worker_turns: 8
  max_planner_inspect_turns: 3

context:
  worker_token_budget: 48000
  log_tail_lines: 150
  prefer_import_contracts: true

persistence:
  # Crash recovery. mobyai resume reloads this file, not a chat transcript.
  database_path: ~/MobyAI/mobyai.db

huggingface:
  # Gated Hub downloads. Never put the token string in this file.
  # Setup writes it to token_file (mode 0600). Override with HF_TOKEN.
  token_file: ~/MobyAI/secrets/hf_token

services:
  mode: external
  health_timeout_seconds: 60
  health_poll_interval_seconds: 0.5
  stop_timeout_seconds: 15
  swap_shared_device: true

hardware:
  # Device indices are configuration, not code constants. Use cpu to skip CUDA.
  planner:
    device: 0
  orchestrator:
    device: 1
  worker:
    device: 0

models:
  planner:
    provider: openai_compatible
    engine: vllm
    model: Qwen/Qwen3-32B
    gpu: 0
    endpoint: http://127.0.0.1:9802
    quantization: q4
    kv_cache_dtype: fp8
    sampling:
      temperature: 0.0
      top_p: 1.0
  orchestrator:
    provider: openai_compatible
    engine: configurable
    model: Qwen/Qwen2.5-7B-Instruct
    gpu: 1
    endpoint: http://127.0.0.1:9801
    sampling:
      temperature: 0.0
      top_p: 1.0
  worker:
    provider: openai_compatible
    engine: vllm
    model: Qwen/Qwen3.5-35B-A3B
    gpu: 0
    endpoint: http://127.0.0.1:9800
    inference:
      tensor_parallel_size: 1
      max_model_len: 65536
      kv_cache_dtype: fp8
      gpu_memory_utilization: 0.92
      enable_chunked_prefill: true
      max_num_seqs: 16
    sampling:
      temperature: 0.0
      top_p: 1.0
