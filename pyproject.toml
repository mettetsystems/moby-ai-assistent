[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobyai"
version = "0.1.0"
description = "Local-first long-horizon agentic software engineering harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MobyAI" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
vault = ["SecretStorage>=3.3,<4"]
archaeology = ["tree-sitter>=0.25,<0.27", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23", "tree-sitter-go>=0.23", "tree-sitter-rust>=0.23", "tree-sitter-java>=0.23", "tree-sitter-c>=0.23", "tree-sitter-cpp>=0.23"]
research = ["mcp>=1.30,<2"]
tracing = ["mlflow>=3.16,<4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mobyai = "mobyai.cli:main"

[tool.hatch.build.targets.wheel.force-include]
"src/mobyai/console/ui.html" = "mobyai/console/ui.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = ["-q"]
